<!doctype html>
<html lang="en" dir="ltr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Library, explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* World: a lettered mechanical plate. Lapis ground, vermilion keys, gilt hairlines.
   Layout: masthead band, then a right-hand index rail beside one main column. Dark-first. */
:root {
  --ground: #0B1222;
  --plate: #13224A;
  --plate-2: #1A2D5C;
  --mast: #13224A; --mast-ink: #EEF1F7; --mast-ink-2: #B4C0DA; --mast-gilt: #D2AC63;
  --ink: #E8ECF4;
  --ink-2: #A3AFC4;
  --gilt: #C29A4F;
  --gilt-soft: rgba(194, 154, 79, .32);
  --key: #EE6A4C;
  --on-key: #0B1222;
  --lapis: #6F9BEA;
  --code-bg: #0E182C;
  --c1: #6F9BEA; --c2: #C29A4F; --c3: #A3AFC4; --c4: #8FB0EE; --c5: #9C8A62;
  --display: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --body: "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --end: right;   /* where code lines align: the reading start of the page */
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail: 236px;
  --measure: 68ch;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #F3F5F9; --plate: #FFFFFF; --plate-2: #E6EDF8; --ink: #111A2C; --ink-2: #4A576D;
    --gilt: #8E6A28; --gilt-soft: rgba(142, 106, 40, .30); --key: #C2391F; --on-key: #FFFFFF; --lapis: #1E4FA8; --code-bg: #EDF1F8;
    --mast: #1E3A78; --mast-ink: #F3F5F9; --mast-ink-2: #C6D1E8; --mast-gilt: #E0BE7A;
    --c1: #1E4FA8; --c2: #8E6A28; --c3: #4A576D; --c4: #3A66B8; --c5: #6B5A33;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground: #F3F5F9; --plate: #FFFFFF; --plate-2: #E6EDF8; --ink: #111A2C; --ink-2: #4A576D;
  --gilt: #8E6A28; --gilt-soft: rgba(142, 106, 40, .30); --key: #C2391F; --on-key: #FFFFFF; --lapis: #1E4FA8; --code-bg: #EDF1F8;
  --mast: #1E3A78; --mast-ink: #F3F5F9; --mast-ink-2: #C6D1E8; --mast-gilt: #E0BE7A;
  --c1: #1E4FA8; --c2: #8E6A28; --c3: #4A576D; --c4: #3A66B8; --c5: #6B5A33;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #0B1222; --plate: #13224A; --plate-2: #1A2D5C; --ink: #E8ECF4; --ink-2: #A3AFC4;
  --gilt: #C29A4F; --gilt-soft: rgba(194, 154, 79, .32); --key: #EE6A4C; --on-key: #0B1222; --lapis: #6F9BEA; --code-bg: #0E182C;
  --mast: #13224A; --mast-ink: #EEF1F7; --mast-ink-2: #B4C0DA; --mast-gilt: #D2AC63;
  --c1: #6F9BEA; --c2: #C29A4F; --c3: #A3AFC4; --c4: #8FB0EE; --c5: #9C8A62;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 20px; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.85; scrollbar-color: var(--gilt-soft) transparent; }
::selection { background: color-mix(in srgb, var(--key) 32%, transparent); color: var(--ink); }
a { color: var(--lapis); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .84em; direction: ltr; unicode-bidi: isolate; }
p { margin: 0; }
.x { }
body.beginner .x { display: none !important; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* letter key: the world's signature */
.k { display: inline-grid; place-items: center; flex: none; width: 1.75em; height: 1.75em; border-radius: 50%; font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1; padding-top: .12em; color: var(--key); border: 1px solid color-mix(in srgb, var(--key) 55%, transparent); background: transparent; transition: background .2s, color .2s; }
.is-sel .k, .k.on { background: var(--key); color: var(--on-key); border-color: var(--key); }

/* masthead */
.mast { background: var(--mast); color: var(--mast-ink); border-bottom: 1px solid var(--gilt); position: relative; }
.mast::after { content: ""; position: absolute; inset: auto 0 -5px 0; height: 1px; background: var(--gilt-soft); }
.mast :focus-visible { outline-color: var(--mast-gilt); }
.mast-in { max-width: 1240px; margin: 0 auto; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 16px; }
.mast-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.mark { display: flex; align-items: baseline; gap: 10px; color: var(--mast-ink-2); font-size: 14px; }
.mark b { font-family: var(--mono); font-weight: 600; color: var(--mast-gilt); font-size: 15px; direction: ltr; }
.mast h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 5.2vw, 60px); line-height: 1.25; margin: 4px 0 0; text-wrap: balance; max-width: 22ch; }
.lede { font-size: 20px; line-height: 1.75; max-width: 64ch; color: var(--mast-ink); }
.intro { font-size: 17px; max-width: var(--measure); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 0; margin: 0; padding: 0; list-style: none; font-size: 14.5px; color: var(--mast-ink-2); }
.legend li:not(:last-child)::after { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--mast-gilt); margin: 0 12px; vertical-align: middle; }
.path { font-family: var(--mono); font-size: 13px; color: var(--mast-ink-2); direction: ltr; text-align: var(--end); }
.lvl { display: inline-flex; border: 1px solid color-mix(in srgb, var(--mast-gilt) 45%, transparent); border-radius: 999px; padding: 3px; gap: 2px; }
.lvl button { all: unset; cursor: pointer; padding: 3px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--mast-ink-2); }
.lvl button[aria-pressed="true"] { background: var(--mast-ink); color: var(--mast); }
.lvl button:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }

/* shell: rail on the right (RTL start), main column beside it */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 56px; padding-block: 40px 96px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; max-height: calc(100vh - 40px); overflow: auto; display: flex; flex-direction: column; gap: 22px; padding-inline-end: 4px; font-size: 14.5px; scrollbar-width: thin; }
.rail h2 { font-family: var(--display); font-size: 17px; font-weight: 700; margin: 0 0 6px; color: var(--gilt); }
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.toc a { display: block; padding-block: 4px; padding-inline: 12px 0; color: var(--ink-2); text-decoration: none; border-inline-start: 1px solid var(--gilt-soft); }
.toc a:hover { color: var(--ink); }
.toc a.here { color: var(--ink); border-inline-start-color: var(--key); font-weight: 600; }
.idx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.idx button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 10px; padding: 3px 4px; border-radius: 6px; }
.idx button:hover { background: var(--plate); }
.idx button:focus-visible { outline: 2px solid var(--lapis); outline-offset: 1px; }
.idx .nm { font-family: var(--mono); font-size: 12.5px; direction: ltr; unicode-bidi: isolate; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.idx .is-sel .nm, .idx button.is-sel .nm { color: var(--ink); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 88px; }
section { min-width: 0; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 20px; }
.sec-h { display: flex; flex-direction: column; gap: 10px; padding-top: 22px; border-top: 1px solid var(--gilt-soft); }
.sec-h h2 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 3.4vw, 38px); line-height: 1.35; margin: 0; text-wrap: balance; }
.sec-h p { max-width: var(--measure); color: var(--ink-2); font-size: 16.5px; }
h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.6; }

/* inline reference to a lettered part */
.ref { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; vertical-align: baseline; border-bottom: 1px dotted var(--gilt); line-height: 1.3; }
.ref .k { width: 1.45em; height: 1.45em; font-size: 12px; }
.ref code { font-size: .82em; }
.ref:hover code, .ref:focus-visible code, .ref.is-sel code { color: var(--key); }
.ref:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
p code, li code, dd code, td code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* cast: the plate's legend of roles */
.cast { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.role { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 18px; align-items: start; padding: 18px 16px; border-top: 1px solid var(--gilt-soft); }
.role:last-child { border-bottom: 1px solid var(--gilt-soft); }
.role.key { background: var(--plate); }
.role .ic { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--gilt-soft); color: var(--gilt); }
.role .ic svg { width: 28px; height: 28px; }
.role h3 { font-size: 18px; }
.role p { color: var(--ink-2); font-size: 15.5px; max-width: 60ch; }
.role .hand { margin-top: 6px; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.role .hand svg { width: 14px; height: 14px; color: var(--gilt); flex: none; }
.role .code { align-self: center; }
.ink { stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.big-idea { font-family: var(--display); font-size: 22px; line-height: 1.75; max-width: 46ch; color: var(--ink); padding: 4px 0; }
.cast-art { margin: 0; border: 1px solid var(--gilt-soft); border-radius: 10px; overflow: hidden; background: var(--plate); }
.cast-art img { display: block; width: 100%; height: auto; }
.cast-art figcaption { padding: 8px 14px; font-size: 14px; color: var(--ink-2); }

/* the mechanism plate */
.plate { background: var(--plate); border: 1px solid var(--gilt); border-radius: 4px; padding: 6px; }
.plate-in { border: 1px solid var(--gilt-soft); border-radius: 2px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.band { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 14px; }
.band-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.band-h b { color: var(--ink); font-weight: 700; }
.band-h .mono { color: var(--ink-2); font-size: 12.5px; }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.node { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 9px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--lc) 34%, transparent); background: color-mix(in srgb, var(--lc) 6%, transparent); transition: border-color .2s, background .2s, opacity .25s; }
.node .k { grid-row: span 2; }
.node .nm { font-family: var(--mono); font-size: 12.5px; font-weight: 600; direction: ltr; text-align: var(--end); overflow-wrap: anywhere; line-height: 1.45; }
.node .sh { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.node:hover { border-color: var(--lc); }
.node:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
.node.is-sel { border-color: var(--key); background: color-mix(in srgb, var(--key) 10%, transparent); }
.node.rel { border-color: var(--lc); }
.plate.focus .node:not(.is-sel):not(.rel) { border-color: var(--gilt-soft); background: transparent; }
.plate.focus .node:not(.is-sel):not(.rel) .nm { color: var(--ink-2); font-weight: 400; }
.down { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; padding-inline-start: 6px; }
.down svg { width: 14px; height: 14px; color: var(--gilt); }
.keybox { display: grid; grid-template-columns: auto minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; border-top: 1px solid var(--gilt-soft); border-bottom: 1px solid var(--gilt-soft); padding: 20px 4px; }
.keybox .big { font-family: var(--display); font-weight: 700; font-size: 56px; line-height: 1; color: var(--key); min-width: 1.2em; text-align: center; padding-top: 6px; }
.keybox .nm { font-family: var(--mono); font-weight: 600; font-size: 18px; direction: ltr; text-align: var(--end); overflow-wrap: anywhere; }
.keybox .lay { font-size: 13.5px; font-weight: 600; color: var(--gilt); margin-top: 2px; }
.keybox .file { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); direction: ltr; text-align: var(--end); overflow-wrap: anywhere; }
.keybox .what { margin-top: 10px; max-width: 60ch; }
.links { display: flex; flex-direction: column; gap: 2px; }
.links .lh { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.links button { all: unset; cursor: pointer; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 14px; }
.links button:hover { background: var(--plate); }
.links button:focus-visible { outline: 2px solid var(--lapis); }
.links .dir { color: var(--gilt); font-size: 12px; font-weight: 600; min-width: 4.2em; }
.links .vb { color: var(--ink-2); }
.links .nm2 { font-family: var(--mono); font-size: 12.5px; direction: ltr; unicode-bidi: isolate; font-weight: 600; }

/* route: one request as a line of lettered stations */
.route-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }
.route-wrap { overflow-x: auto; padding: 4px 0 8px; }
.route { position: relative; display: flex; justify-content: space-between; min-width: 600px; padding: 26px 18px 8px; list-style: none; margin: 0; }
.route::before { content: ""; position: absolute; top: 44px; right: 34px; left: 34px; height: 2px; background: var(--gilt-soft); }
.route .fill { position: absolute; top: 44px; height: 2px; background: var(--key); width: 0; transition: width .75s cubic-bezier(.16, 1, .3, 1); }
.route li { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.route button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.route .k { width: 38px; height: 38px; font-size: 18px; background: var(--ground); }
.route .n { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.route li.is-sel .k { border-color: var(--key); color: var(--key); background: var(--ground); border-width: 2px; }
.route li.done .k { border-color: var(--key); color: var(--key); }
.route li.now .k { background: var(--key); color: var(--on-key); border-color: var(--key); box-shadow: 0 0 0 6px color-mix(in srgb, var(--key) 22%, transparent); }
.route button:focus-visible .k { outline: 2px solid var(--lapis); outline-offset: 3px; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 28px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-top: 1px solid var(--gilt-soft); }
.steps li:last-child button { border-bottom: 1px solid var(--gilt-soft); }
.steps .n { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; text-align: center; }
.steps .who { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; margin-top: 1px; }
.steps .tt { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.5; }
.steps button:hover { background: var(--plate); }
.steps button:focus-visible { outline: 2px solid var(--lapis); outline-offset: -2px; }
.steps button.on { background: var(--plate); }
.steps button.on .n { color: var(--key); font-weight: 700; }
.step-card { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); background: var(--plate); border: 1px solid var(--gilt-soft); border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.step-card .who { font-size: 13.5px; color: var(--ink-2); }
.step-card h3 { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.5; }
.step-card .file { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); direction: ltr; text-align: var(--end); overflow-wrap: anywhere; padding-top: 10px; border-top: 1px solid var(--gilt-soft); }
.ctrl { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; background: transparent; color: var(--ink); border: 1px solid var(--gilt-soft); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.btn:hover { border-color: var(--gilt); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--key); color: var(--on-key); border-color: var(--key); }
.btn.icon { padding: 6px 10px; }
.count { font-size: 13px; color: var(--ink-2); min-width: 3.5ch; text-align: center; font-variant-numeric: tabular-nums; }

/* database register */
.reg { display: flex; flex-direction: column; }
.tbl { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 8px 24px; padding: 16px 6px; border-top: 1px solid var(--gilt-soft); transition: opacity .25s, background .2s; }
.tbl:last-child { border-bottom: 1px solid var(--gilt-soft); }
.tbl-h { all: unset; cursor: pointer; font-family: var(--mono); font-weight: 600; font-size: 14.5px; direction: ltr; text-align: var(--end); align-self: start; overflow-wrap: anywhere; }
.tbl-h:hover, .tbl-h:focus-visible { color: var(--key); }
.tbl-h:focus-visible { outline: 2px solid var(--lapis); outline-offset: 3px; }
.tbl .what { color: var(--ink); font-size: 15.5px; }
.tbl .file { font-family: var(--mono); font-size: 12px; color: var(--ink-2); direction: ltr; text-align: var(--end); grid-column: 2; }
.tbl details { grid-column: 2; }
.tbl summary { cursor: pointer; font-size: 13.5px; color: var(--lapis); font-weight: 600; width: max-content; }
.cols { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr); gap: 4px 18px; margin-top: 8px; font-size: 13.5px; align-items: baseline; }
.cols .cn { font-family: var(--mono); font-weight: 600; direction: ltr; text-align: var(--end); }
.cols .ct { font-family: var(--mono); font-size: 12px; color: var(--ink-2); direction: ltr; text-align: var(--end); }
.cols .cd { color: var(--ink-2); }
.tbl.sel { background: var(--plate); }
.tbl.sel .tbl-h { color: var(--key); }
.reg.focus .tbl:not(.sel):not(.rel) .tbl-h, .reg.focus .tbl:not(.sel):not(.rel) .what { color: var(--ink-2); }
.rels { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rels li { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 4px 18px; padding: 10px 6px; border-top: 1px solid var(--gilt-soft); transition: opacity .25s; }
.rels .kind { font-size: 13px; font-weight: 600; color: var(--gilt); }
.rels .pair { grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--ink-2); direction: ltr; text-align: var(--end); }
.rels.focus li:not(.hit) span { color: var(--ink-2); }
.rels li.hit { background: var(--plate); }

/* parts */
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 28px; }
.part { display: flex; flex-direction: column; gap: 4px; padding: 16px 0; border-top: 1px solid var(--gilt-soft); }
.part .how { font-family: var(--mono); font-size: 12px; color: var(--ink-2); direction: ltr; text-align: var(--end); overflow-wrap: anywhere; }
.part ul { margin: 4px 0 0; padding: 0 18px 0 0; font-size: 15px; color: var(--ink-2); }

/* story */
.story { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.phase { font-family: var(--display); font-weight: 700; font-size: 21px; padding: 26px 0 8px; color: var(--gilt); }

    keybox.innerHTML = '<div class="big" aria-hidden="true">' + esc(KEY[id]) + '</div>' +
      '<div><div class="nm">' + esc(n.name) + '</div><div class="lay">' + esc(L.name) + '</div><div class="file x">' + fileLine(n.file) + '</div><p class="what">' + rich(n.what) + '</p>' +
      (n.inside && n.inside.length ? '<div class="inside x"><div class="lh">' + TX.inside + '</div><ul>' + n.inside.map(function (m) {
        return '<li><span class="sig"><code>' + esc(m.name) + '</code>' + (m.line ? '<span class="ln">' + TX.line + esc(m.line) + '</span>' : '') + '</span><span>' + rich(m.what) + '</span></li>';
      }).join("") + '</ul></div>' : '') + '</div>' +
      '<div class="links"><div class="lh">' + TX.works + '</div>' + (r.links.length ? r.links.map(function (l) {
        return '<button type="button" data-go="' + esc(l.other) + '"><span class="dir">' + l.dir + '</span>' + key(l.other) + '<span><span class="nm2">' + esc(byId[l.other].name) + '</span> <span class="vb">' + bidi(l.verb) + '</span></span></button>';
      }).join("") : '<span class="lh">' + TX.alone + '</span>') + '</div>';
    keybox.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { select(b.dataset.go); }); });
    store("explain-sel:" + D.project.name, id);
    if (opts && opts.reveal) document.getElementById("s-map").scrollIntoView({ block: "start" });
  }
  app.addEventListener("click", function (e) {
    var t = e.target.closest(".node, .idx button, .ref, tr[data-key], .part[data-key], .note[data-key], .fig-body [data-key]");
    if (!t || !t.dataset.key) return;
    var fromAway = !t.closest("#s-map") && !t.closest("tr") && !t.closest(".part") && !t.closest(".note") && !t.closest(".fig-body");
    select(t.dataset.key, { reveal: fromAway && !t.closest(".route") });
  });
  var saved = load("explain-sel:" + D.project.name);
  var keyRole = A && A.cast ? A.cast.filter(function (c) { return c.key && byName[c.code]; })[0] : null;
  select(byId[saved] ? saved : keyRole ? byName[keyRole.code] : order[0]);

  /* ---------- route and steps ---------- */
  var ci = 0, sbtn, stops, fill, routeEl, timer = null, playBtn, flowBody = document.getElementById("flowBody");
  function show(i) {
    ci = (i + F.steps.length) % F.steps.length;
    sbtn.forEach(function (b, j) { b.classList.toggle("on", j === ci); b.setAttribute("aria-current", j === ci ? "step" : "false"); });
    var s = F.steps[ci];
    document.getElementById("count").textContent = (ci + 1) + " / " + F.steps.length;
    document.getElementById("stepBody").innerHTML = '<h3>' + esc(s.title) + '</h3><div class="who">' + rich(s.who) + '</div><p>' + rich(s.text) + '</p>' + (s.file ? '<div class="file x">' + fileLine(s.file) + '</div>' : '');
    if (routeEl) {
      stops.forEach(function (li, j) { li.classList.toggle("done", j < ci); li.classList.toggle("now", j === ci); });
      var first = stops[0], here = stops[ci];
      if (first && here) {
        var a = first.offsetLeft + first.offsetWidth / 2, b = here.offsetLeft + here.offsetWidth / 2;
        fill.style.width = Math.abs(a - b) + "px";
        if (EN) fill.style.left = a + "px"; else fill.style.right = (routeEl.offsetWidth - a) + "px";
      }
    }
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } if (playBtn) playBtn.innerHTML = UI.play + '<span>' + TX.play + '</span>'; }
  function bindFlow() {
    sbtn = flowBody.querySelectorAll("#steps button"); stops = flowBody.querySelectorAll("#route li");
    fill = document.getElementById("fill"); routeEl = document.getElementById("route"); playBtn = document.getElementById("play");
    if (playBtn) playBtn.addEventListener("click", function () {
      if (timer) { stop(); return; }
      if (ci === F.steps.length - 1) show(0);
      playBtn.innerHTML = UI.pause + '<span>' + TX.pause + '</span>';
      timer = setInterval(function () { if (ci >= F.steps.length - 1) { stop(); return; } show(ci + 1); }, 2400);
    });
    flowBody.querySelectorAll("#steps button, #route button").forEach(function (b) { b.addEventListener("click", function () { stop(); show(+b.dataset.i); }); });
    document.getElementById("next").addEventListener("click", function () { stop(); show(ci + 1); });
    document.getElementById("prev").addEventListener("click", function () { stop(); show(ci - 1); });
    show(0);
  }
  bindFlow();
  app.querySelectorAll(".flow-tabs button").forEach(function (t) {
    t.addEventListener("click", function () {
      stop(); F = FLOWS[+t.dataset.f];
      app.querySelectorAll(".flow-tabs button").forEach(function (o) { o.setAttribute("aria-selected", String(o === t)); });
      flowBody.innerHTML = flowHtml(F); bindFlow();
      if (cur) flowBody.querySelectorAll("[data-key]").forEach(function (el) { el.classList.toggle("is-sel", el.dataset.key === cur); });
    });
  });
  window.addEventListener("resize", function () { show(ci); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { show(ci); });

  /* ---------- database ---------- */
  var reg = document.getElementById("reg"), relsEl = document.getElementById("rels"), selT = null;
  app.querySelectorAll(".tbl-h").forEach(function (h) {
    h.addEventListener("click", function () {
      var t = h.dataset.t; selT = selT === t ? null : t;
      var rel = {}; if (selT) rel[selT] = true;
      app.querySelectorAll("#rels li").forEach(function (li) {
        var hit = !!selT && (li.dataset.a === selT || li.dataset.b === selT);
        if (hit) { rel[li.dataset.a] = true; rel[li.dataset.b] = true; }
        li.classList.toggle("hit", hit);
      });
      app.querySelectorAll(".tbl").forEach(function (el) { el.classList.toggle("sel", el.dataset.t === selT); el.classList.toggle("rel", !!rel[el.dataset.t] && el.dataset.t !== selT); });
      reg.classList.toggle("focus", !!selT); if (relsEl) relsEl.classList.toggle("focus", !!selT);
    });
  });

  /* ---------- rail: where am I ---------- */
  var links = {}; app.querySelectorAll(".toc a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) { Object.keys(links).forEach(function (k) { links[k].classList.toggle("here", k === en.target.id); }); } });
    }, { rootMargin: "-20% 0px -70% 0px" });
    secs.forEach(function (s) { var el = document.getElementById(s[0]); if (el) io.observe(el); });
  }

  /* the page is drawn by script, so honour a #section link once it exists */
  if (location.hash.length > 1) { var tgt = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (tgt) requestAnimationFrame(function () { tgt.scrollIntoView({ block: "start" }); }); }

  /* ---------- level ---------- */
  function setLvl(l) {
    document.body.classList.toggle("beginner", l === "beginner");
    app.querySelectorAll(".lvl button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lvl === l)); });
    store("explain-lvl", l);
    show(ci);
  }
  app.querySelectorAll(".lvl button").forEach(function (b) { b.addEventListener("click", function () { setLvl(b.dataset.lvl); }); });
  if (load("explain-lvl") === "beginner") setLvl("beginner");
})();
</script>

</html>
